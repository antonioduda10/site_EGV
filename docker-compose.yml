version: "3.9"
services:
  db:
    image: postgres:16
    container_name: egv-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a private local password in .env}
      POSTGRES_DB: portal_egv
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - egv-data:/var/lib/postgresql/data

volumes:
  egv-data:
