version: "3.9"
services:
  db:
    image: postgres:16
    container_name: egv-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portal_egv
    ports:
      - "5433:5432"
    volumes:
      - egv-data:/var/lib/postgresql/data

volumes:
  egv-data:
